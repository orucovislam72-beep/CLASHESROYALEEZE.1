name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Android Version Name (например: 1.0.1)"
        required: true
        default: "1.0.1"

      versionCode:
        description: "Android Version Code (целое число)"
        required: true
        default: "2"

jobs:
  build-release:
    name: Build & Sign Iron Dominion APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # EXTRACT PROJECT
      # ============================================================

      - name: Extract Iron Dominion Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="iron-dominion (30).zip"

          echo "🔎 Looking for project archive..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ERROR: $ZIP_FILE not found!"
            echo
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          echo "📦 Extracting $ZIP_FILE..."

          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "📁 Extracted project contents:"
          ls -la extracted_project

          # ----------------------------------------------------------
          # The current ZIP contains package.json in its root.
          # ----------------------------------------------------------

          if [ -f "extracted_project/package.json" ]; then
            echo "✅ package.json found in ZIP root."

            cp -a extracted_project/. .
          else
            echo "🔎 package.json not in ZIP root. Searching..."

            PROJECT_DIR=$(find extracted_project \
              -type f \
              -name "package.json" \
              -print \
              -quit | xargs dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "❌ ERROR: package.json was not found!"
              exit 1
            fi

            echo "📂 Project directory: $PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .
          fi

          echo
          echo "🔍 Validating project structure..."

          test -f package.json
          test -d android
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f capacitor.config.ts

          echo "✅ Project structure is valid."


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # BUN
      # ============================================================

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"


      # ============================================================
      # INSTALL JS DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          set -e

          echo "📦 Installing dependencies with Bun..."

          bun install

          echo "✅ Dependencies installed."


      # ============================================================
      # BUILD WEB APP
      # ============================================================

      - name: Build Web Application
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "🌐 Building Iron Dominion web application..."

          bun run build

          echo
          echo "🔍 Checking dist..."

          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist directory was not created!"
            exit 1
          fi

          echo "✅ Web application built successfully."


      # ============================================================
      # CAPACITOR
      # ============================================================

      - name: Sync Capacitor Android
        run: |
          set -e

          echo "📱 Syncing Capacitor Android project..."

          bun x cap sync android

          echo "✅ Capacitor Android sync completed."


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # GRADLE 8.14.3
      #
      # IMPORTANT:
      # We intentionally DO NOT use android/gradlew because
      # gradle-wrapper.jar inside the supplied ZIP is corrupted.
      # ============================================================

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false
          
      # ============================================================
      # CHECK BUILD ENVIRONMENT
      # ============================================================

      - name: Check Build Environment
        run: |
          echo "=============================="
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Node:"
          node --version

          echo
          echo "Bun:"
          bun --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "=============================="


      # ============================================================
      # RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "🔐 Checking release signing secrets..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ Missing KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "❌ Missing KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "❌ Missing KEY_ALIAS"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "❌ Missing KEY_PASSWORD"
            exit 1
          fi

          echo "✅ All signing secrets are present."

          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

          if [ ! -s android/release.keystore ]; then
            echo "❌ ERROR: release.keystore is empty!"
            exit 1
          fi

          echo "✅ Release keystore restored."


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build Android Release APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          VERSION_CODE="${{ github.event.inputs.versionCode }}"
          VERSION_NAME="${{ github.event.inputs.versionName }}"

          echo "=========================================="
          echo "🚀 BUILDING IRON DOMINION"
          echo "=========================================="
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"
          echo "=========================================="

          # Basic validation
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "❌ versionCode must be an integer."
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "❌ versionName looks invalid: $VERSION_NAME"
            exit 1
          fi

          echo
          echo "🔨 Running Gradle..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

          echo
          echo "✅ Gradle build completed."


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find Release APK
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "🔎 Searching for APK..."

          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK not found!"

            echo
            echo "Build output:"
            find android/app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo "✅ APK found:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # PACKAGE APK
      # ============================================================

      - name: Package Release APK
        id: package_apk
        shell: bash
        run: |
          set -e

          VERSION_NAME="${{ github.event.inputs.versionName }}"

          SOURCE_APK="${{ steps.find_apk.outputs.apk_path }}"

          APK_NAME="iron-dominion-v${VERSION_NAME}-release.apk"

          mkdir -p dist_apk

          cp "$SOURCE_APK" "dist_apk/$APK_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist_apk/$APK_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "📦 APK packaged:"
          ls -lh "dist_apk/$APK_NAME"


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.package_apk.outputs.apk_path }}"

          echo "🔐 Verifying APK..."

          if [ ! -f "$APK" ]; then
            echo "❌ APK does not exist!"
            exit 1
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "❌ Android build-tools not found!"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "❌ apksigner not found!"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo
          echo "=========================================="
          echo "✅ APK SIGNATURE VERIFIED"
          echo "=========================================="


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.apk_name }}
          path: dist_apk/*.apk
          if-no-files-found: error
          retention-days: 30

          # ==========================================================
          # END
          # ==========================================================
