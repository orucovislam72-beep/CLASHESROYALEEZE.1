name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Android Version Name (например: 1.0.1)"
        required: true
        default: "1.0.1"

      versionCode:
        description: "Android Version Code (целое число)"
        required: true
        default: "2"

jobs:
  build-release:
    name: Build & Sign Iron Dominion APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # EXTRACT PROJECT
      # ============================================================

      - name: Extract Iron Dominion Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="iron-dominion (30).zip"

          echo "=========================================="
          echo "📦 EXTRACTING IRON DOMINION"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ERROR: $ZIP_FILE not found!"
            echo
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          if [ -f "extracted_project/package.json" ]; then
            echo "✅ package.json found in ZIP root."
            cp -a extracted_project/. .
          else
            echo "🔎 Searching for package.json..."

            PROJECT_DIR=$(
              find extracted_project \
                -type f \
                -name "package.json" \
                -print \
                -quit
            )

            if [ -z "$PROJECT_DIR" ]; then
              echo "❌ ERROR: package.json was not found!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_DIR")"

            echo "📂 Project directory: $PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .
          fi

          echo
          echo "🔍 Validating project structure..."

          test -f package.json
          test -d android
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f capacitor.config.ts

          echo "✅ Project structure is valid."


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # BUN
      # ============================================================

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Installing dependencies..."

          bun install

          echo "✅ Dependencies installed."


      # ============================================================
      # BUILD WEB APPLICATION
      # ============================================================

      - name: Build Web Application
        shell: bash
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🌐 BUILDING WEB APPLICATION"
          echo "=========================================="

          bun run build

          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist directory was not created!"
            exit 1
          fi

          echo "✅ Web application built successfully."


      # ============================================================
      # CAPACITOR SYNC
      # ============================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "📱 SYNCING CAPACITOR ANDROID"
          echo "=========================================="

          bun x cap sync android

          echo "✅ Capacitor Android sync completed."


      # ============================================================
      # JAVA 21
      # ============================================================

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # GRADLE 8.14.3
      # ============================================================

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false


      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Check Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🔧 BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Node:"
          node --version

          echo
          echo "Bun:"
          bun --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "=========================================="


      # ============================================================
      # RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🔐 RESTORING RELEASE KEYSTORE"
          echo "=========================================="

          echo "🔎 Checking release signing secrets..."

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "❌ KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "❌ KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "❌ KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "❌ KEY_PASSWORD is missing."
            exit 1
          fi

          echo "✅ All signing secrets are present."

          echo
          echo "🔓 Decoding keystore..."

          mkdir -p android

          # Remove accidental whitespace/newlines from the Secret.
          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n[:space:]')"

          if [ -z "$CLEAN_BASE64" ]; then
            echo "❌ ERROR: Cleaned Base64 is empty."
            exit 1
          fi

          # Decode.
          if ! printf '%s' "$CLEAN_BASE64" | base64 --decode > android/release.keystore 2>/tmp/base64_error.log; then
            echo "❌ ERROR: Base64 decoding failed."

            if [ -s /tmp/base64_error.log ]; then
              cat /tmp/base64_error.log
            fi

            exit 1
          fi

          echo
          echo "🔎 Checking decoded file..."

          if [ ! -s android/release.keystore ]; then
            echo "❌ ERROR: release.keystore is empty."
            exit 1
          fi

          echo "✅ Keystore file created."

          ls -lh android/release.keystore

          echo
          echo "📏 Keystore size:"
          wc -c android/release.keystore

          echo
          echo "🔐 SHA-256 of restored keystore:"
          sha256sum android/release.keystore

          echo
          echo "🔎 Checking keystore with keytool..."

          if ! keytool \
            -list \
            -keystore android/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keytool_output.txt 2>/tmp/keytool_error.txt
          then
            echo
            echo "❌ ERROR: Cannot open the keystore."

            echo
            echo "Keytool error:"

            cat /tmp/keytool_error.txt || true

            echo
            echo "Possible causes:"
            echo "1. KEYSTORE_PASSWORD is incorrect."
            echo "2. KEYSTORE_BASE64 does not belong to this keystore."
            echo "3. KEYSTORE_BASE64 was copied incorrectly."

            exit 1
          fi

          echo
          echo "✅ Keystore opened successfully."

          echo
          echo "🔑 Keystore entry information:"

          grep -E "Keystore type:|Keystore provider:|Your keystore contains|PrivateKeyEntry|iron-dominion" \
            /tmp/keytool_output.txt || true

          echo
          echo "=========================================="
          echo "✅ RELEASE KEYSTORE VERIFIED"
          echo "=========================================="


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build Android Release APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION_CODE="${{ github.event.inputs.versionCode }}"
          VERSION_NAME="${{ github.event.inputs.versionName }}"

          echo "=========================================="
          echo "🚀 BUILDING IRON DOMINION RELEASE"
          echo "=========================================="

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

          echo "=========================================="

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "❌ versionCode must be an integer."
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "❌ Invalid versionName: $VERSION_NAME"
            exit 1
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "❌ Release keystore not found:"
            echo "$KEYSTORE_PATH"
            exit 1
          fi

          echo
          echo "🔨 Running Gradle..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

          echo
          echo "=========================================="
          echo "✅ GRADLE BUILD COMPLETED"
          echo "=========================================="


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find Release APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail

          echo "🔎 Searching for release APK..."

          APK_PATH="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: Release APK not found."

            echo
            echo "Available build outputs:"

            find android/app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo "✅ APK found:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # PACKAGE APK
      # ============================================================

      - name: Package Release APK
        id: package_apk
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ github.event.inputs.versionName }}"
          SOURCE_APK="${{ steps.find_apk.outputs.apk_path }}"

          APK_NAME="iron-dominion-v${VERSION_NAME}-release.apk"

          mkdir -p dist_apk

          cp "$SOURCE_APK" "dist_apk/$APK_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist_apk/$APK_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "📦 APK packaged:"
          ls -lh "dist_apk/$APK_NAME"


      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.package_apk.outputs.apk_path }}"

          echo "=========================================="
          echo "🔐 VERIFYING APK SIGNATURE"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
            echo "❌ APK does not exist."
            exit 1
          fi

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -1
          )"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "❌ Android Build Tools not found."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "❌ apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo
          echo "=========================================="
          echo "✅ APK SIGNATURE VERIFIED"
          echo "=========================================="


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.apk_name }}
          path: dist_apk/*.apk
          if-no-files-found: error
          retention-days: 30
